# cargo-deny: checks licences, security advisories and dependency sources.
# Run locally with `cargo deny check`.

[graph]
all-features = true

[advisories]
# Every advisory is an error, except ones listed here with a reason.
ignore = []

[licenses]
# Only permissive licences compatible with MIT OR Apache-2.0.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
