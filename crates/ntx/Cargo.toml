[package]
name = "ntx"
description = "NTX (Network Text Exchange): send text, not video, between apps on a local network"
keywords = ["ntx", "broadcast", "text", "protocol", "presentation"]
categories = ["network-programming"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
base64 = "0.23.1"
futures-util = "0.3.34"
gethostname = "1.1.0"
hmac = "0.13.0"
mdns-sd = "0.21.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-tungstenite = "0.30.0"
tracing = "0.1.44"
unicode-normalization = "0.1.26"
uuid = { version = "1.26.1", features = ["v4"] }

[lints]
workspace = true

[dev-dependencies]
tungstenite = "0.30"
