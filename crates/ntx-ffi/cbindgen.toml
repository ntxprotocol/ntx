# Generates include/ntx.h. Regenerate with:  cbindgen --config cbindgen.toml --output include/ntx.h
language = "C"
include_guard = "NTX_H"
cpp_compat = true
documentation = true
documentation_style = "c99"
autogen_warning = "/* Generated by cbindgen from crates/ntx-ffi/src/lib.rs. Do not edit. */"
header = "/* NTX (Network Text Exchange) C API. Copyright (c) 2026 CamelCase Technologies Ltd and the NTX contributors. SPDX-License-Identifier: MIT OR Apache-2.0 */"
usize_is_size_t = true
after_includes = """

/*
 * Rules for every function:
 * - Strings are NUL-terminated UTF-8. Settings, fields and events are JSON.
 * - Functions return NTX_OK or a negative code; ntx_last_error() explains the failure.
 * - A returned `char *` belongs to you: free it with ntx_string_free().
 * - Handles come from ntx_*_start / ntx_*_connect and are freed with ntx_*_free.
 *   They may be used from any thread.
 * - Events are polled with ntx_*_wait_event(); the library never calls back into your code.
 */"""

[export]
include = ["NtxSource", "NtxReceiver", "NtxBrowser", "NtxPublisher", "NtxRelay"]
