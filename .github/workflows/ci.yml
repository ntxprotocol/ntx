name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Tests (including surface tests) on every supported platform.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out the spec (for its example messages)
        uses: actions/checkout@v4
        with:
          repository: ntxprotocol/spec
          path: spec
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The Python extension is tested by the `python` job.
      - run: cargo test --workspace --exclude ntx-python --locked
        env:
          NTX_SPEC_DIR: ${{ github.workspace }}/spec

  # Python bindings: build the package from source and run its tests (real sockets, mDNS and the
  # example script) on the oldest and newest supported Python. Coverage is checked in `checks`.
  python:
    name: python ${{ matrix.python }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, windows-latest]
        # Python 3.9 has no build for newer Ubuntu images, so Linux stays on 24.04.
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ./bindings/python pytest==8.4.2
      - run: python -m pytest
        working-directory: bindings/python
      - name: The type stub matches the built module
        if: matrix.python == '3.13'
        run: |
          python -m pip install mypy==2.4.1
          python -m mypy.stubtest ntxprotocol._ntx

  # abi3 wheels (one per platform, for Python 3.9+) for x64 and arm64. Kept as build artifacts;
  # nothing is published. Wheels built for the runner's own CPU are installed and imported.
  wheels:
    name: wheel (${{ matrix.os }}, ${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, native: true }
          - { os: ubuntu-24.04-arm, target: aarch64, native: true }
          - { os: macos-latest, target: x86_64, native: false }
          - { os: macos-latest, target: aarch64, native: true }
          - { os: windows-latest, target: x64, native: true }
          - { os: windows-latest, target: aarch64, native: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --locked --out dist
      - uses: actions/setup-python@v5
        if: matrix.native
        with:
          python-version: "3.13"
      - name: Install the wheel and import it
        if: matrix.native
        shell: bash
        run: |
          python -m pip install --no-index --find-links bindings/python/dist ntx-protocol
          python -I -c "import ntxprotocol as ntx; assert ntx.render({'a': 'b'}, '{a}') == 'b'"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: bindings/python/dist/*.whl

  # The source distribution, built and then installed from source (which compiles the Rust code).
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the sdist and import it
        run: |
          python -m pip install bindings/python/dist/*.tar.gz
          python -I -c "import ntxprotocol as ntx; assert ntx.render({'a': 'b'}, '{a}') == 'b'"
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: bindings/python/dist/*.tar.gz

  # The same checks as the local pre-commit and pre-push hooks: format, lint, coverage >= 90%,
  # docs, licences and advisories, unused dependencies, duplicated code, secrets.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the spec (for its example messages)
        uses: actions/checkout@v4
        with:
          repository: ntxprotocol/spec
          path: spec
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-deny,cargo-machete,cbindgen
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: pre-commit/action@v3.0.1
        env:
          NTX_SPEC_DIR: ${{ github.workspace }}/spec
        with:
          extra_args: --all-files --hook-stage pre-push
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files --hook-stage pre-commit

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87
      - run: cargo check --workspace --all-targets --locked

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit is signed off (DCO) and follows Conventional Commits
        env:
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9-]+\))?!?: .+'
          for sha in $(git rev-list "$RANGE"); do
            message=$(git log -1 --format=%B "$sha")
            if ! grep -q '^Signed-off-by: ' <<< "$message"; then
              echo "::error::$sha has no Signed-off-by line (use git commit -s)"; status=1
            fi
            if ! head -1 <<< "$message" | grep -Eq "$pattern"; then
              echo "::error::$sha subject is not a Conventional Commit: $(head -1 <<< "$message")"; status=1
            fi
          done
          exit $status
