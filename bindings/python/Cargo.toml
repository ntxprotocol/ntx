[package]
name = "ntx-python"
description = "Python bindings for NTX (Network Text Exchange), built with PyO3"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lib]
name = "ntx_python"
crate-type = ["cdylib"]

[dependencies]
ntx = { path = "../../crates/ntx" }
pyo3 = { version = "0.30.1", features = ["abi3-py39", "generate-import-lib"] }
serde = "1.0.229"
serde_json = "1.0.154"

[lints]
workspace = true
